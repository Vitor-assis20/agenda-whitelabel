x-php: &php
  image: agenda-whitelabel-php   # uma imagem para app, queue e scheduler
  build:
    context: ./docker/php
    args: { UID: "${UID:-1000}", GID: "${GID:-1000}" }
  volumes: [".:/var/www/html"]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }

services:
  app:
    <<: *php
    ports: ["5173:5173"]   # Vite

  # Processa a fila (e-mails). Reinicia até o "composer install" existir no primeiro setup.
  queue:
    <<: *php
    command: php artisan queue:work --tries=3 --backoff=30
    restart: unless-stopped

  # Agendador do Laravel (lembretes a cada 5 minutos).
  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports: ["8000:80"]
    volumes:
      - ".:/var/www/html:ro"
      - "./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on: [app]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agenda
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: secret
    ports: ["5433:5432"]
    volumes:
      - "dbdata:/var/lib/postgresql/data"
      - "./docker/postgres/init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "agenda", "-d", "agenda"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025"]   # UI; SMTP em mailpit:1025

volumes:
  dbdata:
